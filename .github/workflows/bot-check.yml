# Hermes Music's Discord bot on Linux (the Umbrel's Node image): installs its Discord libraries the way
# Hermes does, then asks the bot which encoders it found, pushes a test tone through ffmpeg, the mix and the
# Opus encoder into a Discord audio resource, and logs in with a made-up token (it must say so).
# (Hermes 3.17) Then the ears ("Hey Sour Box"): the speech recognizer installed the way Hermes does, sentences
# spoken by a speech synthesizer sent through the same path Discord's voices take, and what came out of it.
name: Discord bot check

on:
    workflow_dispatch:
        inputs:
            ref:
                description: hermes-umbrel-store branch or tag
                required: true
                default: main

jobs:
    check:
        runs-on: ubuntu-latest
        container: node:22-bookworm-slim
        steps:
            - name: Get the bot and its libraries
              run: |
                  apt-get update > /dev/null
                  apt-get install -y --no-install-recommends ca-certificates curl ffmpeg espeak-ng > /dev/null
                  mkdir -p /bot /deps
                  for f in discord-bot.js sour-ears.py; do
                    curl -fsSL -o /bot/$f "https://raw.githubusercontent.com/Urmomnumber1/hermes-umbrel-store/${{ inputs.ref }}/anjalo-hermes/requests-app/$f" || echo "no $f on this ref"
                  done
                  cd /deps
                  echo '{"name":"hermes-discord-bot","private":true,"dependencies":{"discord.js":"14.28.1","@discordjs/voice":"0.19.2","opusscript":"0.1.1","libsodium-wrappers":"0.8.4"}}' > package.json
                  npm install --omit=dev --no-audit --no-fund --no-package-lock
                  ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=3" /tmp/tone.mp3

            - name: Run it
              run: |
                  cat > /bot/drive.js <<'EOF'
                  const { fork } = require('child_process');
                  const p = fork('/bot/discord-bot.js', [], { env: { ...process.env, BOT_DEPS: '/deps', BOT_DATA: '/tmp/botdata' } });
                  let n = 0;
                  const pending = new Map();
                  p.on('message', (m) => {
                    if (m.type === 'log') console.log('bot log:', m.text);
                    if (m.id && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); }
                  });
                  const call = (cmd, args = {}) => new Promise((ok) => { const id = ++n; pending.set(id, ok); p.send({ id, cmd, args }); });
                  (async () => {
                    let bad = 0;
                    const report = await call('report');
                    console.log(report.result || report.error);
                    const quiet = await call('selftest');
                    console.log('selftest, silence:', JSON.stringify(quiet.result || quiet.error));
                    const tone = await call('selftest', { file: '/tmp/tone.mp3' });
                    console.log('selftest, a 440 Hz tone:', JSON.stringify(tone.result || tone.error));
                    if (!tone.ok || !(tone.result.packets >= 90) || !(tone.result.bytes > quiet.result.bytes * 10)) { console.log('FAIL: no sound came through'); bad++; }
                    const login = await call('login', { token: 'MTAwMDAwMDAwMDAwMDAwMDAw.Abcdef.abcdefghijklmnopqrstuvwxyz0123' });
                    console.log('login with a made-up token:', JSON.stringify({ ok: login.ok, error: login.error }));
                    if (login.ok || !/token/i.test(login.error || '')) { console.log('FAIL: a bad token should be refused'); bad++; }
                    p.kill();
                    process.exit(bad ? 1 : 0);
                  })();
                  EOF
                  node /bot/drive.js

            - name: The ears - install them the way Hermes Music does
              run: |
                  test -f /bot/sour-ears.py || { echo "this ref has no ears: nothing to check"; exit 0; }
                  mkdir -p /tools /data/home
                  curl -fsSL "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /tools --strip-components=1 --wildcards '*/uv'
                  export HOME=/data/home UV_CACHE_DIR=/tools/uv-cache UV_PYTHON_INSTALL_DIR=/tools/uv-python
                  /tools/uv venv --python 3.11 /tools/ears
                  /tools/uv pip install --python /tools/ears/bin/python vosk==0.3.45
                  curl -fsSL -o /tools/ears/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
                  /tools/ears/bin/python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" /tools/ears/model.zip /tools/ears
                  ls /tools/ears/vosk-model-small-en-us-0.15
                  du -sh /tools/ears

            - name: The ears - what they hear
              run: |
                  test -f /bot/sour-ears.py || exit 0
                  say() { espeak-ng -v en-us -s 140 -w "/tmp/$1.wav" "$2"; }
                  say play   "hey sour box. play retry now"
                  say artist "hey sour box, play dancing in the rain by lemon drop"
                  say queue  "hey sour box, queue golden hour"
                  say pause  "hey sour box, pause"
                  say wake   "hey sour box"
                  say chat   "so what do you all want to do about the dragon in the cave"
                  say chat2  "I think we should play a different game tonight"
                  say world  "hey sour box, play the world revolving"
                  espeak-ng -v en-gb -s 165 -w /tmp/world2.wav "hey sour box play the world revolving"
                  say through "hey sour box, play through the night"
                  say stand  "hey sour box, play stand by me"
                  cat > /bot/ears.js <<'EOF'
                  const { fork } = require('child_process');
                  const fs = require('fs');
                  // the receiving side of the voice library (the bot listens through it)
                  const voice = require('/deps/node_modules/@discordjs/voice');
                  console.log('voice library:', voice.version, '| EndBehaviorType:', typeof voice.EndBehaviorType, '| VoiceReceiver:', typeof voice.VoiceReceiver);
                  const dist = fs.readFileSync(require.resolve('/deps/node_modules/@discordjs/voice'), 'utf8');
                  console.log('receiving with end-to-end encryption (DAVE) in the library:', /decrypt/i.test(dist) && /dave/i.test(dist));
                  const p = fork('/bot/discord-bot.js', [], { env: { ...process.env, BOT_DEPS: '/deps', BOT_DATA: '/tmp/botdata' } });
                  let n = 0;
                  const pending = new Map();
                  p.on('message', (m) => {
                    if (m.type === 'log') console.log('bot log:', m.text);
                    if (m.type === 'heard') console.log('bot heard:', JSON.stringify(m));
                    if (m.id && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); }
                  });
                  const call = (cmd, args = {}) => new Promise((ok) => { const id = ++n; pending.set(id, ok); p.send({ id, cmd, args }); });
                  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
                  // what Hermes Music would send: the commands, and the words of a small library
                  // What Hermes Music sends (3.17.1): whole sentences - the commands, and every song of the library with
                  // "play" in front - so the recognizer learns which word follows which. `loose` is what 3.17.0 sent: the
                  // same words, in no order. The library has titles that sound like commands or like each other.
                  const songs = [['retry now', 'nakiso'], ['dancing in the rain', 'lemon drop'], ['golden hour', 'lemon drop'], ['the world revolving', 'toby fox'],
                    ['through the night', 'night juice'], ['paws', 'cat band'], ['rain', 'night juice'], ['late drive', 'night juice'], ['gym hype', 'weezer'],
                    ['rocket man', 'elton john'], ['through the fire and flames', 'dragonforce'], ['the world is yours', 'nas'], ['world on fire', 'sarah mclachlan'],
                    ['play with fire', 'sam tinnesz'], ['evolving', 'the band'], ['revolver', 'madonna'], ['threw it on the ground', 'the lonely island'],
                    ['true', 'spandau ballet'], ['the whirl', 'someone'], ['pause', 'pitbull'], ['pours', 'somebody'], ['thunder road', 'bruce springsteen'],
                    ['in the end', 'linkin park'], ['the end of the world', 'skeeter davis'], ['around the world', 'daft punk'], ['mad world', 'gary jules'],
                    ['stand by me', 'ben e king'], ['stand', 'rem'], ['by your side', 'sade'], ['me and my broken heart', 'rixton']];
                  const WAKE = ['hey sour box', 'sour box'];
                  const SIMPLE = ['pause', 'resume', 'continue', 'keep going', 'skip', 'next', 'previous', 'back', 'go back', 'stop', 'play', 'please'];
                  const VERBS = ['play', 'play the song', 'play some', 'put on', 'queue', 'add'];
                  const sentences = new Set();
                  for (const w of WAKE) { sentences.add(w); for (const c of [...SIMPLE, ...VERBS]) sentences.add(`${w} ${c}`); }
                  for (const c of [...SIMPLE, ...VERBS]) sentences.add(c);
                  for (const [t, a] of songs) { sentences.add(`hey sour box play ${t}`); sentences.add(`play ${t} by ${a}`); sentences.add(`queue ${t}`); }
                  const words = [...sentences];
                  const loose = [...new Set(words.join(' ').split(' '))];
                  const helper = { python: '/tools/ears/bin/python', script: '/bot/sour-ears.py', model: '/tools/ears/vosk-model-small-en-us-0.15' };
                  (async () => {
                    let bad = 0;
                    const check = (ok, what, extra) => { console.log(`${ok ? 'ok  ' : 'FAIL'} ${what}${extra ? '  (' + extra + ')' : ''}`); if (!ok) bad++; };
                    const on = await call('ears', { on: true, ...helper, words: loose });
                    check(on.ok && on.result.on, 'the ears switch on', JSON.stringify(on.result || on.error));
                    let ready = false;
                    for (let i = 0; i < 120 && !ready; i++) { await sleep(500); ready = !!(await call('state')).result.ears.ready; }
                    check(ready, 'the recognizer loads');
                    const hear = async (name) => { const r = await call('eartest', { file: `/tmp/${name}.wav` }); console.log(`  ${name}:`, JSON.stringify(r.result || r.error)); return (r.result && r.result.heard) || {}; };
                    // first the way 3.17.0 listened (loose words), to see what the sentences change - nothing is checked here
                    for (const n of ['world', 'world2', 'through', 'stand', 'pause', 'artist']) console.log('  with loose words,', n, '->', JSON.stringify(await hear(n)));
                    const sent = await call('ears', { on: true, ...helper, words });
                    check(sent.ok, `the sentences are taken (${words.length} of them)`);
                    await sleep(4000);
                    let h = await hear('play');
                    check(h.wake === true && /sour box/.test(h.text) && /play retry now/.test(h.text), '"hey sour box. play retry now"', h.text);
                    h = await hear('artist');
                    check(h.wake === true && /play dancing in (the )?rain by lemon drop/.test(h.text), '"... play dancing in the rain by lemon drop" (a dropped "the" is fine)', h.text);
                    h = await hear('queue');
                    check(h.wake === true && /queue golden hour/.test(h.text), '"hey sour box, queue golden hour"', h.text);
                    h = await hear('pause');
                    check(h.wake === true && /sour box pause$/.test(h.text), '"hey sour box, pause" (with songs called Paws, Pours and Pause around)', JSON.stringify(h));
                    h = await hear('world');
                    // (the synthesizer's "the" comes out as "mad": Hermes Music weighs every reading, and "world revolving" in one of them is what it needs)
                    const readings = (x) => [x.text, ...(x.alts || [])];
                    check(h.wake === true && readings(h).some((t) => /world revolving$/.test(t)), '"hey sour box, play the world revolving": "world revolving" is in a reading', JSON.stringify(h));
                    check(Array.isArray(h.alts) && h.alts.length > 0, 'its other readings come along', JSON.stringify(h.alts));
                    h = await hear('world2');
                    check(h.wake === true && readings(h).some((t) => /world revolving$/.test(t)), '...in another voice, faster', JSON.stringify(h));
                    h = await hear('through');
                    check(h.wake === true && /play through the night$/.test(h.text), '"... play through the night" (a title that starts like the mishearing)', JSON.stringify(h));
                    h = await hear('stand');
                    check(h.wake === true && /play stand by me$/.test(h.text), '"... play stand by me"', JSON.stringify(h));
                    h = await hear('wake');
                    check(h.wake === true && /sour box/.test(h.text), '"hey sour box" on its own', h.text);
                    h = await hear('chat');
                    check(h.wake === false, 'table talk is not for the bot', JSON.stringify(h));
                    h = await hear('chat2');
                    check(h.wake === false, '...even with the word "play" in it', JSON.stringify(h));
                    // the words change (the library grew): the helper keeps running with the new list
                    const more = await call('ears', { on: true, ...helper, words: [...words, 'hey sour box play born to run', 'play born to run by bruce springsteen'] });
                    check(more.ok, 'new sentences are taken');
                    await sleep(4000);
                    h = await hear('play');
                    check(h.wake === true && /play retry now/.test(h.text), 'and it still hears', h.text);
                    const off = await call('ears', { on: false });
                    check(off.ok && off.result.on === false, 'the ears switch off');
                    p.kill();
                    process.exit(bad ? 1 : 0);
                  })();
                  EOF
                  node /bot/ears.js
