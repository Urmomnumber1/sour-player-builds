# Citrus Player: the lighter build of Sour Player (built with SOUR_CITRUS=1, see src/shared/citrus.ts). Its own
# name, icon, settings folder and updates (citrus.yml), so it installs next to Sour Player.
appId: com.urmomnumber1.citrusplayer
protocols:
    - name: Citrus Player
      schemes:
          - citrusplayer
productName: Citrus Player
executableName: citrus-player
extraMetadata:
    name: citrus-player
    productName: Citrus Player
artifactName: Citrus-Player-${os}-${arch}.${ext}
electronVersion: 43.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - '!out/**/*.map'
    - 'package.json'
# one language pack instead of 55 (the app has its own translations); smaller download
electronLanguages:
    - en-US
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: nsis
          arch:
              - x64
    icon: assets/citrus/icon.png

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: assets/citrus/icon.png
    type: distribution
    hardenedRuntime: false
    identity: "-"
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in Feishin'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as Feishin'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
    category: AudioVideo;Audio;Player
    icon: assets/citrus/icon.png
    # the window class Electron gives the app (its package.json name), so taskbars match the window to
    # this launcher (pinning works, the right icon shows)
    desktop:
        entry:
            StartupWMClass: citrus-player
    artifactName: Citrus-Player-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
publish:
    provider: github
    owner: Urmomnumber1
    repo: feishin
    channel: citrus
    releaseType: draft